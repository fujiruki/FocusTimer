name: Build unsigned iPhone IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  build:
    runs-on: macos-latest
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate project
        run: xcodegen generate
      - name: Test on iPhone Simulator
        run: |
          set -euo pipefail
          DEVICE_ID="$(python3 - <<'PY'
          import json
          import subprocess

          data = json.loads(subprocess.check_output(["xcrun","simctl","list","devices","available","-j"]))
          for devices in data.get("devices",{}).values():
              for device in devices:
                  identifier = device.get("deviceTypeIdentifier","")
                  if device.get("isAvailable") and identifier.startswith("com.apple.CoreSimulator.SimDeviceType.iPhone"):
                      print(device["udid"])
                      raise SystemExit
          raise SystemExit("No available iPhone simulator")
          PY
          )"
          test -n "$DEVICE_ID"
          xcodebuild -project FocusTimer.xcodeproj -scheme FocusTimer -configuration Debug -destination "platform=iOS Simulator,id=$DEVICE_ID" -derivedDataPath "$RUNNER_TEMP/DerivedData-Test" CODE_SIGNING_ALLOWED=NO test
      - name: Build for iPhone
        run: |
          set -euo pipefail
          xcodebuild -project FocusTimer.xcodeproj -scheme FocusTimer -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath "$RUNNER_TEMP/DerivedData" CODE_SIGNING_ALLOWED=NO CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" FT_BUILD_COMMIT="${GITHUB_SHA::7}" FT_BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)" build
      - name: Package IPA
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphoneos/FocusTimer.app"
          test -d "$APP"
          test -d "$APP/PlugIns/FocusTimerWidgets.appex"
          mkdir Payload
          cp -R "$APP" Payload/
          zip -qry FocusTimer-unsigned.ipa Payload
      - uses: actions/upload-artifact@v5
        with:
          name: FocusTimer-unsigned-ipa
          path: FocusTimer-unsigned.ipa
          if-no-files-found: error
      - name: Publish latest release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh release delete latest --yes --cleanup-tag || true
          cp FocusTimer-unsigned.ipa lab.akeru.focustimer.ipa
          gh release create latest FocusTimer-unsigned.ipa lab.akeru.focustimer.ipa --target "$GITHUB_SHA" --title "最新ビルド #${GITHUB_RUN_NUMBER}" --notes "ビルド #${GITHUB_RUN_NUMBER}（${GITHUB_SHA::7}）。SideStoreの「My Apps」→「＋」→「Install from URL」に lab.akeru.focustimer.ipa のURLを貼り付けてインストールします（SideStoreはURLのファイル名をBundle IDとして照合するため）。" --latest

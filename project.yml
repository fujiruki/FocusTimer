name: FocusTimer
options:
  bundleIdPrefix: lab.akeru
  deploymentTarget:
    iOS: "17.0"
targets:
  FocusTimer:
    type: application
    platform: iOS
    sources: [FocusTimer, Shared]
    dependencies:
      - target: FocusTimerWidgets
        embed: true
    info:
      path: FocusTimer/Info.plist
      properties:
        CFBundleDisplayName: フォーカスタイマー
        UILaunchScreen: {}
        NSMicrophoneUsageDescription: 作業を声で入力するためにマイクを使います。
        NSSpeechRecognitionUsageDescription: 話した作業名をテキストに変換します。
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSSupportsLiveActivities: true
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        FTBuildCommit: $(FT_BUILD_COMMIT)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.akeru.focustimer
        CURRENT_PROJECT_VERSION: "1"
        FT_BUILD_COMMIT: local
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        CODE_SIGNING_ALLOWED: NO
  FocusTimerWidgets:
    type: app-extension
    platform: iOS
    sources: [FocusTimerWidgets, Shared]
    info:
      path: FocusTimerWidgets/Info.plist
      properties:
        CFBundleDisplayName: フォーカスタイマー
        CFBundleShortVersionString: "1.0"
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.akeru.focustimer.widgets
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "18.0"
        CODE_SIGNING_ALLOWED: NO
  FocusTimerTests:
    type: bundle.unit-test
    platform: iOS
    sources: [FocusTimerTests]
    dependencies:
      - target: FocusTimer
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: lab.akeru.focustimer.tests
        SWIFT_VERSION: "5.0"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
schemes:
  FocusTimer:
    build:
      targets:
        FocusTimer: all
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - FocusTimerTests
    archive:
      config: Release
